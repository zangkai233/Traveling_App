spring.application.name=easychina-spring
server.port=8080

spring.threads.virtual.enabled=true

spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/easychina?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}

planner.python-url=${PYTHON_API_URL:http://127.0.0.1:8000}
planner.max-concurrent=8